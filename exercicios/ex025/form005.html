<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="registro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmasc" value="M"><label for="isxmasc">Masculino</label> <br>
            <input type="radio" name="sexo" id="isxfem" checked value="F"><label for="isxfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Desportos Favoritos</legend>
            <input type="checkbox" name="sbasket" id="isbasket"><label for="isbasket">Basket</label> <br>
            <input type="checkbox" name="ssoccer" id="issoccer" checked><label for="issoccer">Soccer</label> <br>
            <input type="checkbox" name="sswim" id="isswim"><label for="isswim">Swimming</label> <br>
            <input type="checkbox" name="stenis" id="istenis"><label for="istenis">Tênis</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="Submeter">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
