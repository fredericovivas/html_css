<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center; /*Alinhamento Horizontal (left, right, center)*/
            vertical-align: middle; /*Alinhamento Vetical (top, bottom, middle)*/
        }

.numero{
    text-align: right;
}

    </style>

</head>
<body>
    <h1>Minha primeira tabela</h1>

    <!--
        Hierarquia de tabelas (simples)
        
        TABLE = tabela
            TABLE ROW = linha de tabela
            TABLE HEADER = cabeçalho de tabela
            TABLE DATA = dado de tabela
    -->

    <table>
        <tr> <!-- <tr> -> table row   que é a 1ª linha-->
            <td>A1</td> <!-- <td> -> table data -->  
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>  <!-- 2ª linha -->
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr> <!-- 3ª linha -->
            <td>A3</td> 
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr> <!-- 4ª linha -->
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
    
</body>
</html>
