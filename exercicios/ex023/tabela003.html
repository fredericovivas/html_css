<!DOCTYPE html>
<html lang="PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 300px;
            height: 150px;
            border-collapse: collapse;
        }

        td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>

</head>
<body>
    <h1>Mesclagem de Células</h1>
    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            <!-- SE EU RETIRAR A CELULA "C" E QUISER QUE O "B" OCUPE AQUELE ESPAÇO É SÓ FAZER A MESCLAGEM(UNIR) VARIAS COLUNAS (COLSPAN), SE FOR EM VARIAS LINHAS É (ROWSPAN).-->
        </tr>
        <tr>
            <td rowspan="3">D</td> <!-- MESCLAGEM VARIAS LINHAS-->
            <td>E</td>
            <td rowspan="2">F</td>
        </tr>
        <tr>
            
            <td>H</td>
        </tr>
        <tr>
            
            <td colspan="2">M</td>
        </tr>
    </table>
</body>
</html>
