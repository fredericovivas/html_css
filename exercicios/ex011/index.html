<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tenta abrir este site em vários dispositivos diferentes ou simplesmente aumenta e diminui o zoom.</p>

    <picture>
        <source media="(max-width: 700px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">    
        <img src="imagens/foto-g.png" alt="Foto flexivel">
    </picture>


    <h1>Reproduzir áudios</h1>
    <p>Vamos reproduzir um áudio.</p>
    <audio src="" controls autoplay></audio>
    <audio preload="metadata" controls autoplay loop>
        <source src="" type="audio/mp3">   <!-- se o browser da pessoa          suportar .mp3/.wav/.ogg o audio ira funcionar caso contrário não-->
        <source src="media/musica.ogg" type="audio/ogg">
        <source src="media/musica.wav" type="audio/wav">
        <p>Infelizmente o seu navegador não consegue reproduzir áudio. <a href="media/musica.mp3">Clique aqui para baixar o áudio.</a></p>
    </audio>

</body>
</html>
