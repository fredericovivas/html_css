<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul>
        <li type="square">
            <abbr title="Usa a Tag &lt;p&gt;">Parágrafos</abbr>
        </li>
        <li type="square">
            <abbr title="Usa as Tags &lt;h1&gt;...&lt;h6&gt;">Títulos</abbr>
        </li>
        <li type="square">
            <abbr title="Use a Tag &lt;img&gt;">Imagens</abbr>
        </li>
        <li type="square">
            <abbr title="Use a Tag &lt;abbr&gt;">Abreviações</abbr>
        </li>
        <li type="square">
            <abbr title="Use a Tag &lt;code&gt;">Código-fonte</abbr>
        </li>
        <li type="square">
            <abbr title="Use a Tag &lt;ol&gt; e &lt;li&gt;">Listas numeradas</abbr>
        </li>
        <li type="square">
            <abbr title="Use a Tag &lt;ul&gt; e &lt;li&gt;">Listas com demarcadores</abbr>
        </li>
    </ul>

    
</body>
</html>
